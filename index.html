<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Calling Interface</title>
    <style>
        body { 
            margin: 0; 
            background: #111; 
            font-family: sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            color: white; 
        }
        video { 
            width: 90vw; 
            height: 60vh; 
            background: #222; 
            border-radius: 12px; 
            object-fit: cover; 
            margin-bottom: 20px; 
        }
        button { 
            width: 100px; 
            height: 100px; 
            border-radius: 50%; 
            border: none; 
            font-size: 36px; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            box-shadow: 0 8px 15px rgba(0,0,0,0.3);
            transition: transform 0.1s ease;
        }
        button:active {
            transform: scale(0.95);
        }
        .call-btn { background: #2ea44f; color: white; }
        .hang-btn { background: #d73a49; color: white; }
    </style>
</head>
<body>

    <video id="remoteVideo" autoplay playsinline></video>
    <button id="actionBtn" class="call-btn">📞</button>

    <script>
        const serverUrl = "wss://family-video-signaler.onrender.com";
        
        let localStream;
        let peerConnection;
        let socket;
        const remoteVideo = document.getElementById('remoteVideo');
        const actionBtn = document.getElementById('actionBtn');
        let inCall = false;

        // FIXED: Using standard, host-only string declarations inside the urls array to clear the invalid hostname error
        const config = { 
            iceServers: [
                { urls: "stun:://google.com" },
                { urls: "stun:://google.com" }
            ] 
        };

        function initSocket() {
            socket = new WebSocket(serverUrl);
            
            socket.onopen = () => {
                console.log("Connected to live server switcher");
                socket.send(JSON.stringify({ type: 'register-browser' }));
                
                setInterval(() => {
                    if (socket.readyState === WebSocket.OPEN) {
                        socket.send(JSON.stringify({ type: 'ping' }));
                    }
                }, 25000);
            };

            socket.onmessage = async (msg) => {
                const data = JSON.parse(msg.data);
                
                if (data.type === 'tablet-online') {
                    console.log("Tablet ready. Initializing handshake...");
                } else if (data.type === 'offer') {
                    console.log("Received incoming call offer from tablet");
                    await handleIncomingOffer(data.sdp);
                } else if (data.type === 'answer') {
                    console.log("Received response answer token from tablet");
                    await peerConnection.setRemoteDescription(new RTCSessionDescription({ type: 'answer', sdp: data.sdp }));
                } else if (data.type === 'candidate' && peerConnection) {
                    if (data.candidate) {
                        await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
                    }
                }
            };

            socket.onclose = () => {
                console.log("Socket connection lost. Retrying hook...");
                setTimeout(initSocket, 4000);
            };
        }

        async function initializeMediaAndConnection() {
            console.log("Requesting hardware device permissions...");
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: true });
            } catch (mediaErr) {
                console.warn("Microphone blocked. Falling back to video-only.");
                localStream = await navigator.mediaDevices.getUserMedia({ audio: false, video: true });
            }
            
            peerConnection = new RTCPeerConnection(config);
            localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

            peerConnection.ontrack = (event) => {
                if (event.streams && event.streams[0]) {
                    if (remoteVideo.srcObject !== event.streams[0]) {
                        remoteVideo.srcObject = event.streams[0];
                    }
                }
            };

            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    socket.send(JSON.stringify({ 
                        type: 'candidate', 
                        candidate: event.candidate 
                    }));
                }
            };
        }

        async function startCall() {
            try {
                inCall = true;
                actionBtn.className = "hang-btn";
                actionBtn.innerHTML = "❌";

                await initializeMediaAndConnection();

                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);
                socket.send(JSON.stringify({ type: 'offer', sdp: offer.sdp }));
                console.log("WebRTC offer dispatched to Render switchboard.");
            } catch (err) {
                console.error("Critical outgoing connection setup failure: ", err);
                endCall();
            }
        }

        async function handleIncomingOffer(sdp) {
            try {
                inCall = true;
                actionBtn.className = "hang-btn";
                actionBtn.innerHTML = "❌";

                await initializeMediaAndConnection();

                await peerConnection.setRemoteDescription(new RTCSessionDescription({ type: 'offer', sdp: sdp }));
                
                const answer = await peerConnection.createAnswer();
                await peerConnection.setLocalDescription(answer);
                
                socket.send(JSON.stringify({ type: 'answer', sdp: answer.sdp }));
                console.log("WebRTC answer dispatched back to tablet.");
            } catch (err) {
                console.error("Critical incoming connection setup failure: ", err);
                endCall();
            }
        }

        function endCall() {
            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }
            remoteVideo.srcObject = null;
            actionBtn.className = "call-btn";
            actionBtn.innerHTML = "📞";
            inCall = false;
        }

        actionBtn.onclick = () => { if (!inCall) { startCall(); } else { endCall(); } };
        initSocket();
    </script>
</body>
</html>
