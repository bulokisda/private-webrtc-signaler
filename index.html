<!DOCTYPE html>
<html>
<head>
    <title>WebRTC Browser Mesh Node2</title>
    <style>
        video { width: 320px; height: 240px; background: #333; margin: 10px; border-radius: 8px; }
    </style>
</head>
<body>
    <h2>WebRTC 2</h2>
    <video id="localVideo" autoplay playsinline muted></video>
    <video id="remoteVideo" autoplay playsinline></video>
    <br>
    <button id="callBtn" disabled>Call Tablet</button>

    <script>
        const ws = new WebSocket('wss://family-video-signaler.onrender.com');
        let localStream;
        let peerConnection;
        let myId = null;
        const targetId = 'tablet'; // Flutter app identifier
        
        const rtcConfig = { iceServers: [{ urls: 'stun:google.com' }] };

        async function init() {
            localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: true });
            document.getElementById('localVideo').srcObject = localStream;
            ws.send(JSON.stringify({ type: 'register-browser' }));
        }

        ws.onmessage = async (event) => {
            const data = JSON.parse(event.data);
            console.log("!! BROWSER RECEIVED WEBRTC PACKET: ", data);
            
            switch (data.type) {
                case 'registered':
                    myId = data.id;
                    document.getElementById('callBtn').disabled = false;
                    console.log("Registered on server as: " + myId);
                    break;
        
                case 'answer':
                    try {
                        // Ensure we supply a clean, strict RTCSessionDescriptionInit dictionary object literal
                        const sessionDescriptionInit = {
                            type: 'answer',
                            sdp: (typeof data.sdp === 'object' && data.sdp.sdp) ? data.sdp.sdp : data.sdp
                        };
                        
                        await peerConnection.setRemoteDescription(new RTCSessionDescription(sessionDescriptionInit));
                        console.log("✅ Remote SDP Description applied to PeerConnection instance successfully!");
                    } catch (err) {
                        console.error("❌ Handshake failure during remote description construction:", err);
                    }
                    break;
        
                case 'ice-candidate':
                    // Prevent candidate ingestion crashes by ensuring the handshake has settled first
                    if (peerConnection && peerConnection.remoteDescription && data.candidate) {
                        try {
                            let incomingCandidate = null;
                            
                            // Fallback unpacking checks to handle nested dictionary formatting gracefully
                            if (data.candidate.candidate) {
                                incomingCandidate = new RTCIceCandidate(data.candidate);
                            } else {
                                incomingCandidate = new RTCIceCandidate({
                                    candidate: data.candidate,
                                    sdpMid: data.sdpMid || "",
                                    sdpMLineIndex: data.sdpMLineIndex || 0
                                });
                            }
                            
                            await peerConnection.addIceCandidate(incomingCandidate);
                        } catch (candidateErr) {
                            console.warn("Skipped dynamic track candidate adjustment layout:", candidateErr);
                        }
                    }
                    break;
        
                case 'hangup':
                    handleRemoteHangup();
                    break;
            }
        };


        document.getElementById('callBtn').onclick = async () => {
            peerConnection = new RTCPeerConnection(rtcConfig);

            localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

            peerConnection.ontrack = (event) => {
                document.getElementById('remoteVideo').srcObject = event.streams[0];
            };

            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    ws.send(JSON.stringify({
                        type: 'ice-candidate',
                        targetId: targetId,
                        candidate: event.candidate
                    }));
                }
            };

            const offer = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offer);

            ws.send(JSON.stringify({
                type: 'offer',
                targetId: targetId,
                sdp: offer.sdp
            }));
        };

        function handleRemoteHangup() {
            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }
            document.getElementById('remoteVideo').srcObject = null;
        }

        ws.onopen = () => { init(); };
    </script>
</body>
</html>
